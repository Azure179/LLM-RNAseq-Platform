name: Docker integration
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, rnaseq-ci]
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.2'
          architecture: x64
      - name: Run Docker integration
        run: python scripts/ci/run.py docker
      - name: Upload aggregate report
        if: ${{ !cancelled() && hashFiles('outputs/ci/docker/summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-summary
          path: outputs/ci/docker/summary.json
          retention-days: 7
          if-no-files-found: error

